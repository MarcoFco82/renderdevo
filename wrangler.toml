# Cloudflare Pages + Functions config para renderdevo.
# Bindings de R2.
#
#   DATA  → bucket privado, sin dominio público. Se creó para el Journal, que
#           se mudó a marcomotion (2026-08-29). Queda disponible para el
#           siguiente contenido que necesite guardar borradores.
#   FILES → bucket público (media.renderdevo.com). Media del sitio: loops del
#           trabajo seleccionado, capturas de Ashur, imágenes de marca.

name = "renderdevo"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

[[r2_buckets]]
binding = "DATA"
bucket_name = "renderdevo-data"

[[r2_buckets]]
binding = "FILES"
bucket_name = "renderdevo-files"
